name: Build ShadowBoost

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # The CMake presets use the "Visual Studio 17 2022" generator, so pin the
    # runner image that ships VS 2022.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The uploaded zip had an empty extern/CommonLibSSE-NG folder (submodules are
      # not included in GitHub's "Download ZIP"). If the checkout did not fill it,
      # clone the fork named in .gitmodules.
- name: Ensure CommonLibSSE-NG 7.2.0 is present
        shell: pwsh
        run: |
          $path = "extern/CommonLibSSE-NG"
          $revision = "7a60f4de794095d7b0f8928d1b930a52e9a7da83"

          if (-not (Test-Path "$path/.git")) {
            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
            git clone https://github.com/alandtse/CommonLibSSE-NG.git $path
            if ($LASTEXITCODE -ne 0) { throw "Clone failed" }
          }

          git -C $path fetch origin $revision
          if ($LASTEXITCODE -ne 0) { throw "Fetch failed" }

          git -C $path checkout --detach $revision
          if ($LASTEXITCODE -ne 0) { throw "Checkout failed" }

          Write-Host "Using CommonLib commit:"
          git -C $path rev-parse HEAD
  run: |
    $path = "extern/CommonLibSSE-NG"
    $revision = "7a60f4de794095d7b0f8928d1b930a52e9a7da83"

    if (-not (Test-Path "$path/.git")) {
      Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
      git clone --recursive https://github.com/alandtse/CommonLibSSE-NG.git $path
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to clone CommonLibSSE-NG"
      }
    }

    git -C $path fetch --depth 1 origin $revision
    if ($LASTEXITCODE -ne 0) {
      throw "Failed to fetch CommonLibSSE-NG 7.2.0"
    }

    git -C $path checkout --detach $revision
    if ($LASTEXITCODE -ne 0) {
      throw "Failed to checkout CommonLibSSE-NG 7.2.0"
    }

    $actual = (git -C $path rev-parse HEAD).Trim()
    Write-Host "CommonLib revision: $actual"

    if ($actual -ne $revision) {
      throw "Incorrect CommonLib revision!"
    }

    Get-Content "$path/include/SKSE/Version.h" | Select-String "1_7_104"
      - name: Read vcpkg baseline from vcpkg.json
        id: baseline
        shell: pwsh
        run: |
          $b = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          "baseline=$b" >> $env:GITHUB_OUTPUT

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.baseline.outputs.baseline }}

      - name: Configure (all runtimes, same preset as Build Release.bat)
        shell: pwsh
        run: cmake -S . --preset=ALL

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SKSE/Plugins | Out-Null
          Get-ChildItem -Path build -Recurse -Filter "ShadowBoost.dll" | Copy-Item -Destination dist/SKSE/Plugins -Force
          Get-ChildItem -Path build -Recurse -Filter "ShadowBoost.pdb" | Copy-Item -Destination dist/SKSE/Plugins -Force
          Copy-Item -Path package/* -Destination dist -Recurse -Force
          Get-ChildItem dist -Recurse

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ShadowBoost
          path: dist
          if-no-files-found: error
