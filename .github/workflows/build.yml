name: Build ShadowBoost

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # The CMake presets use the Visual Studio 17 2022 generator.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ensure the required CommonLibSSE-NG revision is available.
      - name: Ensure CommonLibSSE-NG 7.2.0 is present
        shell: pwsh
        run: |
          $path = "extern/CommonLibSSE-NG"
          $revision = "7a60f4de794095d7b0f8928d1b930a52e9a7da83"

          if (-not (Test-Path "$path/.git")) {
            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue

            git clone https://github.com/alandtse/CommonLibSSE-NG.git $path
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to clone CommonLibSSE-NG"
            }
          }

          git -C $path fetch origin $revision
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch CommonLibSSE-NG revision $revision"
          }

          git -C $path checkout --detach $revision
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout CommonLibSSE-NG revision $revision"
          }

          $actual = (git -C $path rev-parse HEAD).Trim()
          Write-Host "CommonLib revision: $actual"

          if ($actual -ne $revision) {
            throw "Incorrect CommonLibSSE-NG revision. Expected $revision, got $actual"
          }

          $versionHeader = "$path/include/SKSE/Version.h"

          if (Test-Path $versionHeader) {
            Get-Content $versionHeader | Select-String "1_7_104"
          } else {
            Write-Warning "Version.h was not found at $versionHeader"
          }

      - name: Read vcpkg baseline from vcpkg.json
        id: baseline
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg.json")) {
            throw "vcpkg.json was not found in the repository root"
          }

          $manifest = Get-Content "vcpkg.json" -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "The builtin-baseline field is missing from vcpkg.json"
          }

          "baseline=$baseline" >> $env:GITHUB_OUTPUT

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.baseline.outputs.baseline }}

      - name: Configure (all runtimes, same preset as Build Release.bat)
        shell: pwsh
        run: cmake -S . --preset=ALL

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/SKSE/Plugins" | Out-Null

          $dlls = @(Get-ChildItem -Path build -Recurse -File -Filter "ShadowBoost.dll")

          if ($dlls.Count -eq 0) {
            throw "ShadowBoost.dll was not found. The build may have failed or the output path may have changed."
          }

          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination "dist/SKSE/Plugins" -Force
          }

          $pdbs = @(Get-ChildItem -Path build -Recurse -File -Filter "ShadowBoost.pdb")

          foreach ($pdb in $pdbs) {
            Copy-Item -Path $pdb.FullName -Destination "dist/SKSE/Plugins" -Force
          }

          if (Test-Path "package") {
            Copy-Item -Path "package/*" -Destination "dist" -Recurse -Force
          } else {
            Write-Warning "The package directory does not exist."
          }

          Write-Host "Collected output files:"
          Get-ChildItem -Path dist -Recurse -File

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ShadowBoost
          path: dist
          if-no-files-found: error
